name: OptiLifts CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "dev" ]

jobs:
  lint-test-build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_PROJECTS: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'all' || 'chromium' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true 
        cache-dependency-path: '**/OptiLifts*.csproj'

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 
        cache-dependency-path: 'backend/ai-api/requirements.txt'

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile && pnpm run setup

    - name: Lint Code
      run: pnpm lint

    - name: Run Tests
      run: pnpm test

    - name: Run Coverage
      run: pnpm test:coverage

    - name: Compute and check combined coverage
      id: cov
      run: |
        FE_JSON="frontend/coverage/coverage-summary.json"
        FE_COVERED=$(jq '.total.lines.covered' "$FE_JSON")
        FE_TOTAL=$(jq '.total.lines.total' "$FE_JSON")

        BE_XML=$(find backend/core-api -name "coverage.cobertura.xml" | head -n1)
        BE_COVERED=$(grep -oP 'lines-covered="\K[0-9]+' "$BE_XML")
        BE_TOTAL=$(grep -oP 'lines-valid="\K[0-9]+' "$BE_XML")

        AI_XML="backend/ai-api/coverage.xml"
        AI_COVERED=$(grep -oP 'lines-covered="\K[0-9]+' "$AI_XML")
        AI_TOTAL=$(grep -oP 'lines-valid="\K[0-9]+' "$AI_XML")

        TOTAL_COVERED=$((FE_COVERED + BE_COVERED + AI_COVERED))
        TOTAL_LINES=$((FE_TOTAL + BE_TOTAL + AI_TOTAL))
        PCT=$(awk "BEGIN { printf \"%.1f\", ($TOTAL_COVERED/$TOTAL_LINES)*100 }")

        COLOR="red"
        if (( $(echo "$PCT >= 90" | bc -l) )); then COLOR="brightgreen"
        elif (( $(echo "$PCT >= 75" | bc -l) )); then COLOR="green"
        elif (( $(echo "$PCT >= 50" | bc -l) )); then COLOR="yellow"
        fi

        echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
        echo "color=$COLOR" >> "$GITHUB_OUTPUT"

        echo "Calculated Total Code Coverage: $PCT%"

        if (( $(echo "$PCT < 80.0" | bc -l) )); then
          echo "Code coverage ($PCT%) is below 80%"
          exit 1
        fi

    - name: Update coverage badge gist
      uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: fdc6c732fa17e222fdbb0cd07783dbda
        filename: optilifts-coverage.json
        label: Coverage
        message: ${{ steps.cov.outputs.percentage }}%
        color: ${{ steps.cov.outputs.color }}


    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        if [[ "$PLAYWRIGHT_PROJECTS" == "chromium" ]]; then
          ./node_modules/.bin/playwright install chromium
        else
          ./node_modules/.bin/playwright install
        fi

    - name: Install Playwright OS Dependencies
      run: |
        if [[ "$PLAYWRIGHT_PROJECTS" == "chromium" ]]; then
          ./node_modules/.bin/playwright install-deps chromium
        else
          ./node_modules/.bin/playwright install-deps
        fi


    - name: Start E2E Services
      run: bash ./scripts/e2e-ci.sh start

    - name: Wait for E2E App
      run: bash ./scripts/e2e-ci.sh wait

    - name: Run End-to-End Tests
      run: bash ./scripts/e2e-ci.sh test

    - name: Tear Down E2E Services
      if: always()
      run: bash ./scripts/e2e-ci.sh down

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

    - name: Build frontend image
      run: docker build --build-arg VITE_API_BASE=/api -f frontend/Dockerfile .

    - name: Build core-api image
      run: docker build -f backend/core-api/Dockerfile backend/core-api

    - name: Build ai-api image
      run: docker build -f backend/ai-api/Dockerfile backend/ai-api