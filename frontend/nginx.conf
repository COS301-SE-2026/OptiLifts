server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # try serve file then folder otherwise index as react will take over with routier
        try_files $uri $uri/ /index.html;
    }
    
    location /api/ {
        proxy_pass http://core-api:8080;
        proxy_http_version 1.1;

        # sockets for notifications 
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # take client's IP, gives us secuirity uses such as rate limting and logging
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
}