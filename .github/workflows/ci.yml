name: OptiLifts CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true 
        cache-dependency-path: '**/OptiLifts*.csproj'

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 
        cache-dependency-path: 'backend/ai-api/requirements.txt'

    - name: Install Dependencies
      run: pnpm run setup

    - name: Lint Code
      run: pnpm lint

    - name: Run Tests
      run: pnpm test

    - name: Build Applications
      run: pnpm build
