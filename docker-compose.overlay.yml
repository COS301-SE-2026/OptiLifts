services:
  # load balancer
  load-balancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.overlay.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api

  core-api:
    build: 
      context: ./backend/core-api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_CONNECTION_STRING=Host=db;Port=5432;Database=${POSTGRES_DB:-optilifts};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=SuperSecretTestingKeyThatIsAtLeast32BytesLong!
      - ENCRYPTION_KEY=SuperSecretEncryptionKeyThatIs32Bytes!
      - DEV_SEEDING=true
      - E2E_TESTING=true
    deploy:
      resources:
        limits:
          cpus: '0.5'   
          memory: '1G'
    depends_on:
      - db

  ai-api:
    build: 
      context: ./backend/ai-api
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '1G'

  # databse with local connections limit changed
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-optilifts}
    deploy:
      resources:
        limits:
          cpus: '1.0'  
          memory: '2G'   
    ports:
      - "5432:5432" 
