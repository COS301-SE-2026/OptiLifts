name: OptiLifts CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "dev" ]

jobs:
  lint-test-build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        cache: true 
        cache-dependency-path: '**/OptiLifts*.csproj'

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 
        cache-dependency-path: 'backend/ai-api/requirements.txt'

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile && pnpm run setup

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Start E2E Services
      run: bash ./scripts/e2e-ci.sh start

    - name: Wait for E2E App
      run: bash ./scripts/e2e-ci.sh wait

    - name: Lint Code
      run: pnpm lint

    - name: Run Tests
      run: pnpm test

    - name: Run End-to-End Tests
      run: bash ./scripts/e2e-ci.sh test

    - name: Tear Down E2E Services
      if: always()
      run: bash ./scripts/e2e-ci.sh down

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

    - name: Build frontend image
      run: docker build --build-arg VITE_API_BASE=/api -f frontend/Dockerfile .

    - name: Build core-api image
      run: docker build -f backend/core-api/Dockerfile backend/core-api

    - name: Build ai-api image
      run: docker build -f backend/ai-api/Dockerfile backend/ai-api
